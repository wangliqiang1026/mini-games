window.AD_CONFIG = {

};
(function () {
  var cfg = window.AD_CONFIG;
  var clientOk = /^ca-pub-\d{10,20}$/.test(cfg.client);
  function fillSlot(el) {
    var ph = el.querySelector(".ad-placeholder");
    if (!clientOk) { el.classList.add("ad-slot--empty"); return; }
    if (ph) ph.parentNode.removeChild(ph);
    var slotId = cfg.slots[el.getAttribute("data-ad")] || "";
    var slotOk = /^\d{9,12}$/.test(slotId) && slotId !== "0000000000";
    if (!slotOk) return;
    var ins = document.createElement("ins");
    ins.className = "adsbygoogle";
    ins.style.display = "block";
    ins.setAttribute("data-ad-client", cfg.client);
    ins.setAttribute("data-ad-slot", slotId);
    ins.setAttribute("data-ad-format", "auto");
    ins.setAttribute("data-full-width-responsive", "true");
    el.appendChild(ins);
    try { (window.adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
  }
  if (clientOk) {
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + cfg.client;
    s.setAttribute("crossorigin", "anonymous");
    document.head.appendChild(s);
  }
  window.__fillAdSlots = function () {
    var els = document.querySelectorAll(".ad-slot:not([data-lazy])");
    for (var i = 0; i < els.length; i++) fillSlot(els[i]);
  };
  window.__fillLazyAds = function () {
    var els = document.querySelectorAll(".ad-slot[data-lazy]");
    for (var i = 0; i < els.length; i++) fillSlot(els[i]);
  };
  window.__fillAdSlots();
})();
